- resource: 'http://192.168.18.102:2283/api/server/statistics'
  scan_interval: 60
  headers:
    x-api-key: !secret immich_apikey
  sensor:
    - name: Immich Photos
      unique_id: sensor.immich_photos
      value_template: "{{ value_json['photos'] }}"
      availability: "{{ value_json['photos'] is defined }}"
      unit_of_measurement: photos
    - name: Immich Videos
      unique_id: sensor.immich_videos
      value_template: "{{ value_json['videos'] }}"
      availability: "{{ value_json['videos'] is defined }}"
      unit_of_measurement: videos
    - name: Immich Usage Photos
      unique_id: sensor.immich_usage_photos
      value_template: "{{ value_json['usagePhotos'] / (1024 ** 3) }}"
      availability: "{{ value_json['usagePhotos'] is defined }}"
      unit_of_measurement: GB
    - name: Immich Usage Videos
      unique_id: sensor.immich_usage_videos
      value_template: "{{ value_json['usageVideos'] / (1024 ** 3) }}"
      availability: "{{ value_json['usageVideos'] is defined }}"
      unit_of_measurement: GB

- resource: https://api-open.data.gov.sg/v2/real-time/api/psi
  headers:
    X-Api-Key: !secret data_gov_sg_apikey
  scan_interval: 3600
  sensor:
    - name: Twenty-Four Hour PSI
      unique_id: sensor.twenty_four_hour_psi
      value_template: "{{ value_json.data['items'][0].readings.psi_twenty_four_hourly.south }}"
      json_attributes_path: "$.data['items'][0].readings"
      json_attributes:
        - o3_eight_hour_max
        - co_sub_index
        - pm25_twenty_four_hourly
        - so2_twenty_four_hourly
        - o3_sub_index
        - pm10_sub_index
        - co_eight_hour_max
        - no2_one_hour_max
        - pm10_twenty_four_hourly
        - psi_twenty_four_hourly
        - pm25_sub_index
        - so2_sub_index
      unit_of_measurement: points
    - name: One Hour NO2
      unique_id: sensor.one_hour_no2
      value_template: "{{ value_json.data['items'][0].readings.no2_one_hour_max.south }}"
      unit_of_measurement: points
  
- resource: https://api.waqi.info/feed/@1663/
  scan_interval: 300
  params:
    token: !secret aqicn_apikey
  sensor:
    - name: One Hour Pollutant Standards Index
      unique_id: sensor.one_hour_pollutant_standards_index
      value_template: "{{ value_json.data.aqi }}"
      unit_of_measurement: points
    - name: One Hour CO
      unique_id: sensor.one_hour_co
      value_template: "{{ value_json.data.iaqi.co.v }}"
      unit_of_measurement: points
    - name: One Hour PM10
      unique_id: sensor.one_hour_pm10
      value_template: "{{ value_json.data.iaqi.pm10.v }}"
      unit_of_measurement: points
    - name: One Hour PM2.5
      unique_id: sensor.one_hour_pm2_5
      value_template: "{{ value_json.data.iaqi.pm25.v }}"
      unit_of_measurement: points
    - name: One Hour SO2
      unique_id: sensor.one_hour_so2
      value_template: "{{ value_json.data.iaqi.so2.v }}"
      unit_of_measurement: points
    - name: One Hour O3
      unique_id: sensor.one_hour_o3
      value_template: "{{ value_json.data.iaqi.o3.v }}"
      unit_of_measurement: points
      