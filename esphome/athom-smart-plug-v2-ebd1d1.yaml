substitutions:
  name: athom-smart-plug-v2-ebd1d1
  friendly_name: Dishwasher

api:
  encryption:
    key: !secret dishwasher_api_key

packages:
  Athom Technology.Smart Plug V2: "github://athom-tech/athom-configs/athom-smart-plug-v2.yaml"
  appliance_plug: !include packages/appliance_plug.yaml
  
esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

select:
  - id: !extend status_sensor
    options:
      - "Off"
      - Washing
      - Cooling
      - Standby

binary_sensor:
  - platform: homeassistant
    id: door
    entity_id: binary_sensor.dishwasher_door
    on_state:
      then:
        - if:
            condition:
              - binary_sensor.is_off: door
            then:
              - switch.turn_on: relay
            else:
              - if:
                  condition:
                    - binary_sensor.is_on: door
                  then:
                    - switch.turn_off: load_clean
  - platform: template
    id: idle
    lambda: "return id(relay).state == 'on' && id(power_sensor).state <= 5;"
    filters:
      - delayed_on: 15min
    on_state:
      then:
        - if:
            condition:
              - binary_sensor.is_on: idle
            then:
              - if:
                  condition:
                    select.is:
                      id: status_sensor
                      options: Cooling
                  then:
                    switch.turn_on: load_clean
              - delay: 5s
              - switch.turn_off: relay
  - platform: template
    id: washing
    lambda: "return id(power_sensor).state > 5;"
    on_state:
      then:
        - if:
            condition:
              - binary_sensor.is_on: washing
            then:
              - select.set:
                  id: status_sensor
                  option: Washing
            else:
              - if:
                  condition:
                    - binary_sensor.is_off: washing
                  then:
                    - if:
                        condition:
                          - select.is:
                              id: status_sensor
                              options: Washing
                        then:
                          - select.set:
                              id: status_sensor
                              option: Cooling
                        else:
                          - select.set:
                              id: status_sensor
                              option: Standby

sensor:
  - platform: template
    name: Last Run Duration
    id: last_run_duration
    device_class: duration

text_sensor:
  - platform: template
    name: Last Run Started
    id: last_run_started
    device_class: timestamp
  - platform: template
    name: Last Run Ended
    id: last_run_ended
    device_class: timestamp
    on_value:
      then:
        - if:
            condition:
              lambda: "return id(run_started) > id(run_ended);"
            then:
              sensor.template.publish:
                id: last_run_duration
                state: !lambda "return id(run_started) - id(run_ended);"

switch:
  - platform: template
    id: load_clean
    name: Load Clean
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
  - id: !extend relay
    on_turn_on:
      then:
        - select.set:
            id: status_sensor
            option: Standby
    on_turn_off:
      then:
        - select.set:
            id: status_sensor
            option: "Off"