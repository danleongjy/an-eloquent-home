substitutions:
  name: rice-cooker
  sntp_server_1: "192.168.18.1"
packages:
  athom.smart-plug-v2: github://athom-tech/athom-configs/athom-smart-plug-v2.yaml
  appliance_plug: !include packages/appliance_plug.yaml

esphome:
  name: ${name}
  friendly_name: Rice Cooker
  name_add_mac_suffix: false
api:
  encryption:
    key: !secret rice_cooker_api_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: 192.168.18.34
    gateway: 192.168.18.1
    subnet: 255.255.255.0

web_server: !remove

select:
  - id: !extend status_sensor
    options:
      - "Off"
      - Cooking
      - Warming
      - Standby
                
binary_sensor:
  - platform: template
    name: Running
    lambda: "return id(power_sensor).state > 1;"
  - platform: homeassistant
    entity_id: binary_sensor.rice_cooker_lid
    id: lid
    on_state:
      then:
        - if:
            condition:
              binary_sensor.is_off: lid
            then:
              - switch.turn_on: relay
  - platform: template
    id: running_to_standby
    lambda: "return id(power_sensor).state < 0.4;"
    filters:
      - delayed_on: 60s
    on_state:
      then:
        - if:
            condition:
              binary_sensor.is_on: running_to_standby
            then:
            - select.set: 
                id: status_sensor
                option: Standby
  - platform: template
    id: turn_off
    lambda: "return id(power_sensor).state < 0.4;"
    filters:
      - delayed_on: 15min
    on_state:
      then:
        - if:
            condition:
              binary_sensor.is_on: turn_off
            then:
            - switch.turn_off: relay
                
sensor:
  - id: !extend latest_run_duration
    lambda: 'return id(status_sensor).current_option() == "Cooking";'
  - platform: template
    id: watts_recent_max
    lambda: "return id(power_sensor).state;"
    update_interval: 10s
    filters:
      - max:
          window_size: 30
          send_every: 10
    on_value_range:
      - above: 200
        then:
          - select.set: 
              id: status_sensor
              option: Cooking
      - above: 30
        below: 140
        then:
          - select.set: 
              id: status_sensor
              option: Warming
              