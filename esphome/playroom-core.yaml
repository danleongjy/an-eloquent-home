substitutions:
  core_room: playroom
  hostname_room: playroom
  capitalised_room_name: Playroom
  lamp_entity: light.yard_light_entity
  lamp_auto_control: automation.yard_motion_light
  lamp_type: light-recessed
  display_rotation: 90°
  rtttl_output_pin: GPIO25
  volume: "0.003" # 0.005 generally loud enough

esp32:
  board: esp32dev
    
esphome:
  name: ${hostname_room}-core
  friendly_name: ${capitalised_room_name} Core

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret playroom_core_api_key

ota:
  - platform: esphome
    id: my_ota
    password: !secret playroom_core_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  manual_ip:
    static_ip: 192.168.18.17
    gateway: 192.168.18.1
    subnet: 255.255.255.0

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Playroom-Core Fallback Hotspot"
    password: !secret ap_password
  
  on_connect:
    - lambda: 'id(current_view).publish_state("current_time");'
    - lambda: 'id(current_command).publish_state("none");'

captive_portal:

packages:
  rtttl: !include packages/room_core_rtttl.yaml

time:
  - platform: homeassistant
    id: homeassistant_time

globals:
  - id: height
    type: int
    initial_value: '320'
  - id: width
    type: int
    initial_value: '240'
  - id: initial_volume
    type: double
    initial_value: ${volume}

script:
  - id: reset_command
    then:
      - delay: 0.5s
      - if:
          condition:
            lambda: 'return id(current_command).state != "none";'
          then:
            - lambda: 'id(current_command).publish_state("none");'
    mode: queued
  - id: reset_view
    mode: restart
    then:
      - if:
          condition:
            rtttl.is_playing
          then:
            - rtttl.stop
      - delay: 120s
      - display.page.show: current_time
  - id: doorbell
    then:
      - select.set:
          id: ringtone
          option: Doorbell
      - button.press: play_ringtone
      - display.page.show: main_door
      - delay: 10s
      - display.page.show: current_time
  - id: draw_display_main_time
    then:
      - lambda: |
          // display time
          id(interface_display).strftime(id(width) * 0.25, id(height) * 0.35, id(main_time), TextAlign::CENTER, "%H", id(homeassistant_time).now());
          id(interface_display).strftime(id(width) * 0.75, id(height) * 0.35, id(main_time), TextAlign::CENTER, "%M", id(homeassistant_time).now());
          if (id(homeassistant_time).now().second % 2 == 0) {
            id(interface_display).print(id(width) * 0.5, id(height) * 0.325, id(main_time), TextAlign::CENTER, ":");
          }
  - id: draw_display_main_lights
    then:
      - lambda: |
          // tab
          if (id(lights_power).state) {
            id(interface_display).filled_rectangle(0, id(height) * 0.75, id(width) * 0.25, id(height) * 0.15, id(slider));
            id(interface_display).line(0, id(height) * 0.75, id(width) * 0.25, id(height) * 0.75, id(slider));
          }
          // main display
          if (id(lights_power).state) {
            id(interface_display).filled_rectangle(0, id(height) * (0.75 - (0.75 * (id(lights_brightness).state) / 255)), id(width), id(height) * (0.75 * (id(lights_brightness).state) / 255), id(slider));
            id(interface_display).image(id(width) * 0.5, id(height) * 0.375, id(main_lights), ImageAlign::CENTER, id(device_on));
          } else {
            id(interface_display).image(id(width) * 0.5, id(height) * 0.375, id(main_lights), ImageAlign::CENTER, id(device_off));
          }
          // auto control indicator
          if (!id(lights_auto_control).state) {
            if (id(lights_power).state) {
              id(interface_display).image(id(width) * 0.85, id(height) * 0.23, id(manual_control), ImageAlign::CENTER, id(device_on));
            } else {
              id(interface_display).image(id(width) * 0.85, id(height) * 0.23, id(manual_control), ImageAlign::CENTER, id(device_off));
            }
          }
  - id: draw_display_main_lamp
    then:
      - lambda: |
          // tab
          if (id(lamp_power).state) {
            id(interface_display).filled_rectangle(0, id(height) * 0.75, id(width) * 0.25, id(height) * 0.15, id(slider));
            id(interface_display).line(0, id(height) * 0.75, id(width) * 0.25, id(height) * 0.75, id(slider));
          }
          // main display
          if (id(lamp_power).state) {
            id(interface_display).filled_rectangle(0, id(height) * (0.75 - (0.75 * (id(lamp_brightness).state) / 255)), id(width), id(height) * (0.75 * (id(lamp_brightness).state) / 255), id(slider));
            id(interface_display).image(id(width) * 0.5, id(height) * 0.375, id(main_lamp), ImageAlign::CENTER, id(device_on));
          } else {
            id(interface_display).image(id(width) * 0.5, id(height) * 0.375, id(main_lamp), ImageAlign::CENTER, id(device_off));
          }
          // auto control indicator
          if (!id(lamp_auto_control).state) {
            if (id(lamp_power).state) {
              id(interface_display).image(id(width) * 0.85, id(height) * 0.23, id(manual_control), ImageAlign::CENTER, id(device_on));
            } else {
              id(interface_display).image(id(width) * 0.85, id(height) * 0.23, id(manual_control), ImageAlign::CENTER, id(device_off));
            }
          }
  - id: draw_display_main_fan
    then:
      - lambda: |
          // tab
          if (id(fan_power).state) {
            id(interface_display).filled_rectangle(0, id(height) * 0.75, id(width) * 0.25, id(height) * 0.15, id(slider));
            id(interface_display).line(0, id(height) * 0.75, id(width) * 0.25, id(height) * 0.75, id(slider));
          }
          // main display
          if (id(fan_power).state) {
            id(interface_display).filled_rectangle(0, id(height) * (0.75 - (0.75 * id(fan_speed).state / 100)), id(width), id(height) * (0.75 * id(fan_speed).state / 100), id(slider));
            id(interface_display).image(id(width) * 0.5, id(height) * 0.375, id(main_fan_forward), ImageAlign::CENTER, id(device_on));
          } else {
            id(interface_display).image(id(width) * 0.5, id(height) * 0.375, id(main_fan_forward), ImageAlign::CENTER, id(device_off));
          }
          // auto control indicator
          if (!id(fan_auto_control).state) {
            if (id(fan_power).state) {
              id(interface_display).image(id(width) * 0.85, id(height) * 0.23, id(manual_control), ImageAlign::CENTER, id(device_on));
            } else {
              id(interface_display).image(id(width) * 0.85, id(height) * 0.23, id(manual_control), ImageAlign::CENTER, id(device_off));
            }
          }
  - id: draw_display_main_vacuum
    then:
      - lambda: |
          // tab
          if (strcmp(id(vacuum_current_state).state.c_str(), "paused") == 0 || strcmp(id(vacuum_current_state).state.c_str(), "idle") == 0) {
            id(interface_display).filled_rectangle(0, id(height) * 0.75, id(width) * 0.25, id(height) * 0.15, id(alarm_dismissable));
            id(interface_display).line(0, id(height) * 0.75, id(width) * 0.25, id(height) * 0.75, id(alarm_dismissable));
          } else if (strcmp(id(vacuum_current_state).state.c_str(), "cleaning") == 0 || strcmp(id(vacuum_current_state).state.c_str(), "returning") == 0 || (id(vacuum_battery_charging).state && id(vacuum_battery_level).state < 100)) {
            id(interface_display).filled_rectangle(0, id(height) * 0.75, id(width) * 0.25, id(height) * 0.15, id(slider));
            id(interface_display).line(0, id(height) * 0.75, id(width) * 0.25, id(height) * 0.75, id(slider));
          }
          // main display
          if (strcmp(id(vacuum_current_state).state.c_str(), "paused") == 0 || strcmp(id(vacuum_current_state).state.c_str(), "idle") == 0) {
            id(interface_display).filled_rectangle(0, id(height) * (0.75 - (0.75 * (id(vacuum_battery_level).state) / 100)), id(width), id(height) * (0.75 * (id(vacuum_battery_level).state) / 100), id(alarm_dismissable));
            id(interface_display).image(id(width) * 0.5, id(height) * 0.375, id(main_vacuum), ImageAlign::CENTER, id(device_off));
          } else if (strcmp(id(vacuum_current_state).state.c_str(), "cleaning") == 0 || strcmp(id(vacuum_current_state).state.c_str(), "returning") == 0) {
            id(interface_display).filled_rectangle(0, id(height) * (0.75 - (0.75 * (id(vacuum_cleaning_progress).state) / 100)), id(width), id(height) * (0.75 * (id(vacuum_cleaning_progress).state) / 100), id(slider));
            id(interface_display).image(id(width) * 0.5, id(height) * 0.375, id(main_vacuum), ImageAlign::CENTER, id(device_on));            
          } else if (id(vacuum_battery_charging).state && id(vacuum_battery_level).state < 100) {
            id(interface_display).filled_rectangle(0, id(height) * (0.75 - (0.75 * (id(vacuum_battery_level).state) / 100)), id(width), id(height) * (0.75 * (id(vacuum_battery_level).state) / 100), id(slider));
            id(interface_display).image(id(width) * 0.5, id(height) * 0.375, id(main_vacuum_charging), ImageAlign::CENTER, id(device_on));            
          } else {
            id(interface_display).image(id(width) * 0.5, id(height) * 0.375, id(main_vacuum), ImageAlign::CENTER, id(device_off));
          }
  - id: draw_display_main_doorbell
    then:
      - lambda: |
          id(interface_display).image(id(width) * 0.5, id(height) * 0.375, id(main_doorbell), ImageAlign::CENTER, id(device_on));
  - id: draw_display_borders
    then:
      - lambda: |
          id(interface_display).rectangle(0, 0, id(width), id(height), id(border));
          id(interface_display).line(id(width) * 0.25, id(height) * 0.75, id(width) * 0.25, id(height) * 0.9, id(border));
          id(interface_display).line(id(width) * 0.5, id(height) * 0.75, id(width) * 0.5, id(height) * 0.9, id(border));
          id(interface_display).line(id(width) * 0.75, id(height) * 0.75, id(width) * 0.75, id(height) * 0.9, id(border));
          id(interface_display).line(id(width) * 0.25, id(height) * 0.75, id(width), id(height) * 0.75, id(border));
          id(interface_display).line(0, id(height) * 0.9, id(width), id(height) * 0.9, id(border));
  - id: draw_display_bottom_status_bar
    then:
      - lambda: |
          id(interface_display).printf(id(width) * 0.5, id(height) * 0.95, id(status_bar), TextAlign::CENTER, "\U0000e846%.1f°C \U0000f164%.1f%% \U0000f7e8%.0flx", id(room_temp).state, id(room_hum).state, id(room_lux).state);

text_sensor:
  - platform: template
    id: current_view
    name: 'Current View'
  - platform: template
    id: current_command
    name: 'Current Command'
    on_value:
      - script.execute: 
          id: reset_command
  - platform: homeassistant
    id: vacuum_current_state
    entity_id: vacuum.valetudo_hestia

sensor:
  - platform: homeassistant
    id: lights_brightness
    entity_id: light.${core_room}_lights
    attribute: brightness
  - platform: homeassistant
    id: lamp_brightness
    entity_id: ${lamp_entity}
    attribute: brightness
  - platform: homeassistant
    id: room_lux
    entity_id: sensor.playroom_radar_lux
  - platform: homeassistant
    id: fan_speed
    entity_id: fan.${core_room}_fan
    attribute: percentage
  - platform: homeassistant
    id: vacuum_cleaning_progress
    entity_id: sensor.vacuum_current_run_cleaning_progress
  - platform: homeassistant
    id: vacuum_battery_level
    entity_id: sensor.valetudo_hestia_battery_level
  - platform: homeassistant
    id: room_temp
    entity_id: sensor.${core_room}_temperature
  - platform: homeassistant
    id: room_hum
    entity_id: sensor.${core_room}_humidity

binary_sensor:
  - platform: homeassistant
    id: playroom_occupancy
    entity_id: binary_sensor.playroom_radar_occupancy
    on_state:
      then:
        if:
          condition:
            binary_sensor.is_on: playroom_occupancy
          then:
            - light.turn_on: backlight
            - display.page.show: current_time
          else:
            light.turn_off: backlight
  - platform: homeassistant
    id: lights_power
    entity_id: light.${core_room}_lights
  - platform: homeassistant
    id: lamp_power
    entity_id: ${lamp_entity}
  - platform: homeassistant
    id: fan_power
    entity_id: fan.${core_room}_fan
  - platform: homeassistant
    id: lights_auto_control
    entity_id: automation.${core_room}_motion_lights
  - platform: homeassistant
    id: lamp_auto_control
    entity_id: ${lamp_auto_control}
  - platform: homeassistant
    id: fan_auto_control
    entity_id: automation.${core_room}_motion_fan
  - platform: homeassistant
    id: vacuum_battery_charging
    entity_id: binary_sensor.vacuum_battery_charging
  - platform: gpio
    pin: 37
    name: 'Left Button'
    id: left_button
    filters:
      - invert:
    on_multi_click:
      - timing:
          - ON for at most 1s
          - OFF for at least 0.5s
        then:
          - script.execute: reset_view
          - if:
              condition:
                light.is_on: backlight
              then:
                - if:
                    condition:
                      lambda: 'return id(current_view).state == "lights";'
                    then:
                      - lambda: 'id(current_command).publish_state("lights_on");'
                - if:
                    condition:
                      lambda: 'return id(current_view).state == "lamp";'
                    then:
                      - lambda: 'id(current_command).publish_state("lamp_on");'
                - if:
                    condition:
                      lambda: 'return id(current_view).state == "fan";'
                    then:
                      - lambda: 'id(current_command).publish_state("fan_on");'
                - if:
                    condition:
                      lambda: 'return id(current_view).state == "vacuum";'
                    then:
                      - homeassistant.action:
                          action: vacuum.start
                          data:
                            entity_id: vacuum.valetudo_hestia
      - timing:
          - ON for at least 1.5s
        then:
          - script.execute: reset_view
          - if:
              condition:
                light.is_on: backlight
              then:
                - if:
                    condition:
                      lambda: 'return id(current_view).state == "lights";'
                    then:
                      - while:
                          condition:
                            binary_sensor.is_on: left_button
                          then:
                            - lambda: 'id(current_command).publish_state("lights_brighten");'
                            - delay: 0.75s
                - if:
                    condition:
                      lambda: 'return id(current_view).state == "lamp";'
                    then:
                      - while:
                          condition:
                            binary_sensor.is_on: left_button
                          then:
                            - lambda: 'id(current_command).publish_state("lamp_brighten");'
                            - delay: 0.75s
                - if:
                    condition:
                      lambda: 'return id(current_view).state == "fan";'
                    then:
                      - while:
                          condition:
                            binary_sensor.is_on: left_button
                          then:
                            - lambda: 'id(current_command).publish_state("fan_speed_up");'
                            - delay: 0.75s
      - timing:
          - ON for at most 1s
          - OFF for at most 1s
          - ON for at most 1s
          - OFF for at least 0.5s
        then:
          - script.execute: reset_view
          - if:
              condition:
                light.is_on: backlight
              then:
                - if:
                    condition:
                      lambda: 'return id(current_view).state == "current_time";'
                    then:
                      - lambda: 'id(current_command).publish_state("set_special_scene");'
                      - delay: 0.5s
                      - light.turn_off: backlight
                - if:
                    condition:
                      lambda: 'return id(current_view).state == "lights";'
                    then:
                      - lambda: 'id(current_command).publish_state("set_recommended_room_scene");'
                - if:
                    condition:
                      lambda: 'return id(current_view).state == "lamp";'
                    then:
                      - lambda: 'id(current_command).publish_state("set_recommended_room_scene");'
  - platform: gpio
    pin: 38
    name: 'Middle Button'
    id: middle_button
    filters:
      - invert:
    on_multi_click:
      - timing:
          - ON for at most 1s
          - OFF for at least 0.5s
        then:
          - script.execute: reset_view
          - if:
              condition:
                light.is_on: backlight
              then:
                - if:
                    condition:
                      display.is_displaying_page: current_time
                    then:
                      display.page.show: lights
                    else:
                      display.page.show_next: interface_display
      - timing:
          - ON for at most 1s
          - OFF for at most 1s
          - ON for at most 1s
          - OFF for at least 0.5s
        then:
          - script.execute: reset_view
          - if:
              condition:
                light.is_on: backlight
              then:
                - if:
                    condition:
                      lambda: 'return id(current_view).state == "lights";'
                    then:
                      - if:
                          condition:
                            lambda: 'return id(lights_auto_control).state;'
                          then:
                            lambda: 'id(current_command).publish_state("lights_manual_control");'
                          else:
                            lambda: 'id(current_command).publish_state("lights_auto_control");'
                - if:
                    condition:
                      lambda: 'return id(current_view).state == "lamp";'
                    then:
                      - if:
                          condition:
                            lambda: 'return id(lamp_auto_control).state;'
                          then:
                            lambda: 'id(current_command).publish_state("lamp_manual_control");'
                          else:
                            lambda: 'id(current_command).publish_state("lamp_auto_control");'
                - if:
                    condition:
                      lambda: 'return id(current_view).state == "fan";'
                    then:
                      - if:
                          condition:
                            lambda: 'return id(fan_auto_control).state;'
                          then:
                            lambda: 'id(current_command).publish_state("fan_manual_control");'
                          else:
                            lambda: 'id(current_command).publish_state("fan_auto_control");'
                - if:
                    condition:
                      lambda: 'return id(current_view).state == "vacuum";'
                    then:
                      - homeassistant.action:
                          action: vacuum.return_to_base
                          data:
                            entity_id: vacuum.valetudo_hestia
  - platform: gpio
    pin: 39
    name: 'Right Button'
    id: right_button
    filters:
      - invert:
    on_multi_click:
      - timing:
          - ON for at most 1s
          - OFF for at least 0.5s
        then:
          - script.execute: reset_view
          - if:
              condition:
                light.is_on: backlight
              then:
                - if:
                    condition:
                      lambda: 'return id(current_view).state == "current_time";'
                    then:
                      - light.turn_off: backlight
                - if:
                    condition:
                      lambda: 'return id(current_view).state == "lights";'
                    then:
                      - lambda: 'id(current_command).publish_state("lights_off");'
                - if:
                    condition:
                      lambda: 'return id(current_view).state == "lamp";'
                    then:
                      - lambda: 'id(current_command).publish_state("lamp_off");'
                - if:
                    condition:
                      lambda: 'return id(current_view).state == "fan";'
                    then:
                      - lambda: 'id(current_command).publish_state("fan_off");'
                - if:
                    condition:
                      lambda: 'return id(current_view).state == "vacuum";'
                    then:
                      - homeassistant.action:
                          action: vacuum.pause
                          data:
                            entity_id: vacuum.valetudo_hestia
      - timing:
          - ON for at least 1.5s
        then:
          - script.execute: reset_view
          - if:
              condition:
                light.is_on: backlight
              then:
                - if:
                    condition:
                      lambda: 'return id(current_view).state == "lights";'
                    then:
                      - while:
                          condition:
                            binary_sensor.is_on: right_button
                          then:
                            - lambda: 'id(current_command).publish_state("lights_darken");'
                            - delay: 0.75s
                - if:
                    condition:
                      lambda: 'return id(current_view).state == "lamp";'
                    then:
                      - while:
                          condition:
                            binary_sensor.is_on: right_button
                          then:
                            - lambda: 'id(current_command).publish_state("lamp_darken");'
                            - delay: 0.75s
                - if:
                    condition:
                      lambda: 'return id(current_view).state == "fan";'
                    then:
                      - while:
                          condition:
                            binary_sensor.is_on: right_button
                          then:
                            - lambda: 'id(current_command).publish_state("fan_slow_down");'
                            - delay: 0.75s
      - timing:
          - ON for at most 1s
          - OFF for at most 1s
          - ON for at most 1s
          - OFF for at least 0.5s
        then:
          - script.execute: reset_view
          - if:
              condition:
                light.is_on: backlight
              then:
                - if:
                    condition:
                      lambda: 'return id(current_view).state == "current_time";'
                    then:
                      - homeassistant.action:
                          action: script.turn_on
                          data:
                            entity_id: script.turn_off_all
                - if:
                    condition:
                      lambda: 'return id(current_view).state == "lights";'
                    then:
                      - lambda: 'id(current_command).publish_state("turn_off_room");'
                - if:
                    condition:
                      lambda: 'return id(current_view).state == "lamp";'
                    then:
                      - lambda: 'id(current_command).publish_state("turn_off_room");'

button:
  - platform: template
    name: Ring Doorbell
    id: ring_doorbell
    icon: "mdi:bell-ring-outline"
    on_press:
      then:
        - script.execute: doorbell

output:
  - platform: ledc
    pin: 32
    id: backlight_pwm

color:
  - id: border
    red: 50%
    green: 50%
    blue: 50%
  - id: device_on
    hex: FFC107
  - id: device_off
    hex: 4D729D
  - id: slider
    hex: 4D729D #41A7F2
  - id: alarm_dismissable
    hex: F2900F
  - id: black
    hex: '000000'

font:
  - file: 
      type: gfonts
      family: Roboto
      weight: bold
    id: main_time
    size: 80
  - file: 
      type: gfonts
      family: Roboto
    id: small_time
    size: 30
    extras:
      - file: "gfonts://Material+Symbols+Outlined"
        glyphs: ["\U0000e425"] # mdi-timer
  - file: 
      type: gfonts
      family: Roboto
      weight: light
    id: status_bar
    size: 20
    extras:
      - file: "gfonts://Material+Symbols+Outlined"
        glyphs: ["\U0000e846","\U0000f164","\U0000f7e8"] #mdi-thermometer, mdi-humidity, mdi-brightness

image:
  - platform: file
    type: binary
    transparency: chroma_key
    file: mdi:clock-outline
    id: tab_current_time
    resize: 30x30
  - platform: file
    type: binary
    transparency: chroma_key
    file: mdi:lightbulb-group
    id: tab_lights
    resize: 30x30
  - platform: file
    type: binary
    transparency: chroma_key
    file: mdi:light-recessed
    id: tab_lamp
    resize: 30x30
  - platform: file
    type: binary
