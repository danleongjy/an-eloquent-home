esp32:
  framework:
    type: esp-idf
    version: 5.5.5 # https://github.com/mtheli/philips_shaver/blob/main/esphome/KNOWN_ISSUES.md#esp-bridge-loses-pairings-with-esp-idf-556
    sdkconfig_options:
      CONFIG_BT_GATTC_MAX_CACHE_CHAR: "100"
      CONFIG_BT_GATTC_NOTIF_REG_MAX: "30"
      
api:
  custom_services: true
  homeassistant_services: true 

esp32_ble:
  io_capability: none
  max_notifications: 30
  max_connections: 4
  
esp32_ble_tracker:
  scan_parameters:
    active: true

external_components:
  - source:
      type: git
      url: https://github.com/mtheli/philips_shaver
      ref: main
      path: esphome/components
    components: [philips_shaver]
    refresh: 0s                  # always fetch latest code on build

philips_shaver:
  bridge_id: "shaver"
  mac_address: "FD:6C:B0:A1:4E:E4"   # <-- your shaver's MAC
  connected:
    name: "Shaver Connected"