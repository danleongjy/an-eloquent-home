    comment: Per-device watchdog settings include the configurable missed-package threshold.
  test-before-configure:
    status: done
  unique-config-entry:
    status: done
  config-flow-test-coverage:
    status: done
    comment: 30+ test cases in test_config_flow.py covering all flows.
  runtime-data:
    status: done
  test-before-setup:
    status: done
  appropriate-polling:
    status: done
    comment: Uses local push via CoAP, no polling.
  entity-unique-id:
    status: done
  has-entity-name:
    status: done
