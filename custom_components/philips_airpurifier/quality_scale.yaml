    status: done
  dependency-transparency:
    status: done
    comment: Uses philips-airctrl from PyPI.
  action-setup:
    status: done
    comment: Services (filter_reset, set_child_lock) registered in async_setup().
  common-modules:
    status: done
    comment: Base entity class in entity.py.
  docs-installation-instructions:
    status: exempt
    comment: Custom integration installed via HACS.
  docs-removal-instructions:
    status: exempt
    comment: Standard HA integration removal.

  # Silver
  config-entry-unloading:
    status: done
  log-when-unavailable:
    status: done
  reauthentication-flow:
    status: exempt
    comment: No authentication required for CoAP protocol.
  parallel-updates:
    status: done
  test-coverage:
    status: done
    comment: 99.76% coverage (1670/1674 statements), exceeds 95% requirement.

  # Gold
  discovery:
    status: done
    comment: DHCP discovery via MAC address prefixes and registered devices.
  discovery-update-info:
    status: done
    comment: >-
      DHCP discoveries are matched against existing entries by MAC (or host)
      before any network I/O; the stored host is updated and the entry
      reloaded when the device IP changes.
  reconfiguration-flow:
    status: done
  dynamic-devices:
    status: exempt
    comment: Single device per config entry.
  diagnostics:
    status: done
  repair-issues:
    status: done
  entity-translations:
    status: done
  entity-device-class:
    status: done
  entity-disabled-by-default:
    status: done
    comment: Diagnostic entities use EntityCategory.DIAGNOSTIC.
  stale-devices:
    status: exempt
    comment: Single device per config entry.

  # Platinum
  async-dependency:
    status: done
    comment: philips-airctrl uses asyncio.
  inject-websession:
    status: exempt
    comment: Uses CoAP protocol, not HTTP.
  strict-typing:
    status: done
    comment: Pyright strict mode enabled with 0 errors in pyrightconfig.json.
  best-practices:
    status: done
